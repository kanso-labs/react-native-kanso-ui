name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Three pushes to a branch inside a minute otherwise run three Builds to
# completion, and only the last one is answering a question anybody is asking:
# a pull request's check list shows the head commit alone. Grouped per workflow
# and ref, so Build never waits on Lint or Test and one branch never waits on
# another.
#
# cancel-in-progress is on everywhere except main, where each push is the
# repository re-verifying what it just merged rather than iterating towards a
# review, and the push whose bundle Codecov records against main.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: build-${{ github.ref }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Skips the prepare script, which only installs husky's git hooks. A
      # runner has no commits to hook, so it is pure install time here.
      - name: Set up Node
        uses: kanso-labs/actions/setup-node@v4.3.1
        with:
          ignore-scripts: true

      # CODECOV_TOKEN is what switches the bundle-analysis plugin on — see the
      # comment beside it in tsdown.config.ts. It is an organisation secret, so
      # a pull request from a fork gets an empty string here and the build runs
      # without the analysis rather than failing for want of a secret it was
      # never going to be given.
      - name: Run build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: npm run build

      # publint reads package.json and the packed file list, so it catches an
      # exports target pointing at a file the tarball does not carry. attw
      # resolves the declarations the way a consumer's TypeScript does.
      #
      # A step of this job rather than a job of its own: a required check is
      # matched by its exact job name, and a new job would be a name nothing
      # requires. It reads dist/, so it comes after the build.
      - name: Verify the published package shape
        run: npm run package:check
